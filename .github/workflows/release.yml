name: Release skills
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python scripts/build_skills.py
      - name: Publish release with skill archives and workbook
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSETS="dist/financing-true-cost.zip dist/financing-true-cost.skill \
                  dist/commercial-financing-disclosure.zip dist/commercial-financing-disclosure.skill \
                  workbook/CapKit.xlsx"
          for f in $ASSETS; do test -f "$f" || { echo "missing $f"; exit 1; }; done
          if ls dist | grep -q funding-mix-optimizer; then echo "frozen optimizer must not ship"; exit 1; fi
          gh release create "$GITHUB_REF_NAME" $ASSETS --title "CapKit $GITHUB_REF_NAME" --generate-notes || \
          gh release upload "$GITHUB_REF_NAME" $ASSETS --clobber
