name: Release skills
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Tag matches the package version
        run: |
          v=$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          test "${GITHUB_REF_NAME#v}" = "$v" || { echo "tag $GITHUB_REF_NAME != version $v"; exit 1; }
      - run: ruff check src tests scripts
      - run: mypy src/capkit
      - run: python -m pytest -q
      - run: python scripts/build_skills.py --check
      - run: python scripts/build_skills.py
      - name: Regenerate and verify the workbook that ships
        run: |
          PYTHONPATH=src python -m capkit workbook '{"path": "workbook/CapKit.xlsx"}'
          python scripts/verify_workbook.py workbook/CapKit.xlsx --fuzz 10
      - name: Checksums
        run: |
          (cd dist && sha256sum financing-true-cost.zip financing-true-cost.skill \
            commercial-financing-disclosure.zip commercial-financing-disclosure.skill) > SHA256SUMS
          (cd workbook && sha256sum CapKit.xlsx) >> SHA256SUMS
      - name: Publish (fails if the release already exists; published assets are never replaced)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSETS="dist/financing-true-cost.zip dist/financing-true-cost.skill \
                  dist/commercial-financing-disclosure.zip dist/commercial-financing-disclosure.skill \
                  workbook/CapKit.xlsx SHA256SUMS"
          for f in $ASSETS; do test -f "$f" || { echo "missing $f"; exit 1; }; done
          if ls dist | grep -q funding-mix-optimizer; then echo "frozen optimizer must not ship"; exit 1; fi
          gh release create "$GITHUB_REF_NAME" $ASSETS --title "CapKit $GITHUB_REF_NAME" --generate-notes
