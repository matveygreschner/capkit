name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check src tests scripts
      - name: Type check (mypy)
        run: mypy src/capkit
      - name: Unit tests with coverage
        run: |
          python -m coverage run --source=src/capkit -m pytest -q
          python -m coverage report --fail-under=85
          python -m coverage report --include=src/capkit/apr.py,src/capkit/disclosures.py --fail-under=94
      - name: Rebuild workbook and verify it against the engine (fuzzed)
        run: |
          PYTHONPATH=src python -m capkit workbook '{"path": "workbook/CapKit.xlsx"}'
          python scripts/verify_workbook.py workbook/CapKit.xlsx --fuzz 10
      - name: Skills are valid and in sync with src/
        run: python scripts/build_skills.py --check
      - name: Committed workbook is up to date
        run: git diff --exit-code --stat workbook/CapKit.cells.json
